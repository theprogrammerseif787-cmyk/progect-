<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام إدارة النتائج</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f2f4f8; font-family: 'Segoe UI', Tahoma, sans-serif; }
    h1 { color: #333; font-weight: bold; }
    .card { border-radius: 15px; border: none; }
    input { border: 2px solid #999 !important; background: #e9ecef !important; font-size: 20px !important; height: 50px !important; text-align: center; font-weight: bold; }
    label { font-weight: bold; font-size: 18px; }
    .student-item { background: #fff; border-radius: 10px; padding: 10px; margin-bottom: 8px; border: 1px solid #ddd; font-size: 18px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  </style>
</head>
<body>

<div class="container my-4">
  <div class="text-center mb-4">
    <h1>🎓 نظام إدارة النتائج</h1>
  </div>

  <div id="errorBox" class="alert alert-danger d-none"></div>

  <div class="card shadow p-4 mb-4">
    <label class="form-label">اسم الطالب</label>
    <input id="studentName" type="text" class="form-control mb-3" value="ياسمين" readonly>

    <label class="form-label">نسبة الحضور %</label>
    <input id="attendance" type="number" class="form-control mb-3" value="80" readonly>

    <div class="row g-3 mb-3">
      <div class="col-4">
        <label class="form-label">المادة 1</label>
        <input id="grade1" type="number" class="form-control" value="50" readonly>
      </div>
      <div class="col-4">
        <label class="form-label">المادة 2</label>
        <input id="grade2" type="number" class="form-control" value="52" readonly>
      </div>
      <div class="col-4">
        <label class="form-label">المادة 3</label>
        <input id="grade3" type="number" class="form-control" value="51" readonly>
      </div>
    </div>

    <div class="row g-3">
      <div class="col-6">
        <button id="addBtn" class="btn btn-primary w-100" style="height:50px; font-size:20px;">إضافة طالب</button>
      </div>
      <div class="col-6">
        <button id="raafaBtn" class="btn btn-success w-100" style="height:50px; font-size:20px;">تفعيل لجنة الرأفة</button>
      </div>
    </div>
  </div>

  <div class="card shadow p-4 mb-4">
    <h4>قائمة الطلاب:</h4>
    <div id="studentsListDiv"><p class="text-muted">لسه مفيش طلاب...</p></div>
  </div>

  <div class="card shadow p-4">
    <h4>التقرير النهائي للجنة الرأفة:</h4>
    <div id="reportDiv"><p class="text-muted">لم يتم تفعيل اللجنة بعد</p></div>
  </div>
</div>

<script>
  class Student {
    #grades; #attendance;
    constructor(name, g1, g2, g3, attendance) {
      if (!name || name.trim() === "") throw new Error("من فضلك اكتبي اسم الطالب");
      this.name = name.trim();
      this.grades = [g1, g2, g3];
      this.attendance = attendance;
    }
    set grades(arr) {
      for (let g of arr) {
        if (g === "" || g === null || isNaN(g)) throw new Error("مينفعش تسيبي أي درجة فاضية");
        if (g < 0 || g > 100) throw new Error("الدرجة لازم تكون بين 0 و 100");
      }
      this.#grades = arr.map(Number);
    }
    get grades() { return this.#grades; }
    set attendance(val) {
      if (val === "" || val === null || isNaN(val)) throw new Error("مينفعش تسيبي نسبة الحضور فاضية");
      if (val < 0 || val > 100) throw new Error("نسبة الحضور لازم تكون بين 0 و 100");
      this.#attendance = Number(val);
    }
    get attendance() { return this.#attendance; }
    getAverage() {
      let sum = this.#grades.reduce((a, b) => a + b, 0);
      return sum / this.#grades.length;
    }
  }

  let studentsList = [];
  const nameInput = document.getElementById("studentName");
  const g1Input = document.getElementById("grade1");
  const g2Input = document.getElementById("grade2");
  const g3Input = document.getElementById("grade3");
  const attInput = document.getElementById("attendance");
  const addBtn = document.getElementById("addBtn");
  const raafaBtn = document.getElementById("raafaBtn");
  const errorBox = document.getElementById("errorBox");
  const studentsDiv = document.getElementById("studentsListDiv");
  const reportDiv = document.getElementById("reportDiv");

  function renderStudents() {
    if (studentsList.length === 0) {
      studentsDiv.innerHTML = `<p class="text-muted">لسه مفيش طلاب...</p>`;
      return;
    }
    studentsDiv.innerHTML = "";
    studentsList.forEach((student, index) => {
      studentsDiv.innerHTML += `
        <div class="student-item">
          <span><strong>${student.name}</strong> - درجات: ${student.grades.join(" - ")} - حضور: ${student.attendance}% - المتوسط: ${student.getAverage().toFixed(2)} - ${student.getAverage() >= 50 ? "✅ ناجح" : "❌ راسب"}</span>
          <button class="btn btn-danger btn-sm" onclick="deleteStudent(${index})" style="min-width:60px;">حذف</button>
        </div>`;
    });
  }

  function deleteStudent(index) {
    studentsList.splice(index, 1);
    saveToStorage();
    renderStudents();
    reportDiv.innerHTML = `<p class="text-muted">لم يتم تفعيل اللجنة بعد</p>`;
  }

  function saveToStorage() {
    const data = studentsList.map(s => ({ name: s.name, grades: s.grades, attendance: s.attendance }));
    localStorage.setItem("yasminStudents", JSON.stringify(data));
  }

  window.onload = function() {
    const saved = localStorage.getItem("yasminStudents");
    if (saved) {
      const data = JSON.parse(saved);
      data.forEach(d => {
        studentsList.push(new Student(d.name, d.grades[0], d.grades[1], d.grades[2], d.attendance));
      });
      renderStudents();
    }
  };

  // إضافة عادي - كل دوسة بتضيف طالب
  addBtn.onclick = function () {
    try {
      errorBox.classList.add("d-none");
      const student = new Student(
        nameInput.value,
        Number(g1Input.value),
        Number(g2Input.value),
        Number(g3Input.value),
        Number(attInput.value)
      );
      studentsList.push(student);
      saveToStorage();
      renderStudents();
    } catch (error) {
      errorBox.textContent = error.message;
      errorBox.classList.remove("d-none");
    }
  };

  raafaBtn.onclick = function () {
    if (studentsList.length === 0) {
      reportDiv.innerHTML = `<div class="alert alert-warning">ضيفي طالب الأول وبعدين فعلي اللجنة</div>`;
      return;
    }
    const struggling = studentsList.filter(s => {
      let avg = s.getAverage();
      return avg >= 40 && avg <= 55;
    });
    if (struggling.length === 0) {
      reportDiv.innerHTML = `<div class="alert alert-info">مفيش طلاب مستحقين للرأفة، كل الطلاب تمام ✅</div>`;
      return;
    }
    const newAverages = struggling.map(s => s.getAverage() + 7);
    const total = newAverages.reduce((acc, val) => acc + val, 0);
    const generalAvg = total / newAverages.length;
    const namesList = struggling.map(s => `<li>${s.name} - كان متوسطه ${s.getAverage().toFixed(1)} وبقى ${(s.getAverage()+7).toFixed(1)}</li>`).join("");
    reportDiv.innerHTML = `
      <div class="alert alert-success">
        <h5>✅ تقرير لجنة الرأفة</h5>
        <p><strong>عدد الطلاب المستحقين للرأفة:</strong> ${struggling.length}</p>
        <ul>${namesList}</ul>
        <p><strong>المتوسط العام بعد الرأفة:</strong> ${generalAvg.toFixed(1)}</p>
      </div>`;
  };
</script>

</body>
</html>
